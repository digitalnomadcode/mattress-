services:
  db:
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_USER: velora
      POSTGRES_DB: velora_store
      POSTGRES_PASSWORD: ${DB_LOCAL_PASSWORD:?Run npm run setup:local first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - velora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora -d velora_store"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  velora_pgdata:
